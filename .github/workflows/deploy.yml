name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: only the deploy job needs to write Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Regenerates public/readings.json for a rolling 20-year window and runs
      # every check: all days resolved, Sundays have a Gospel, Mondays have both
      # readings, and ferial Ordinary Time Monday lectionary numbers match
      # 305 + (week - 1) * 6. A failure here stops the deploy.
      - name: Build and verify readings
        run: npm run build

      - name: Fail if the site is missing files
        run: |
          test -f public/index.html
          test -f public/sw.js
          test -f public/readings.json

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    # Only publish from main; pull requests build and verify but never deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
